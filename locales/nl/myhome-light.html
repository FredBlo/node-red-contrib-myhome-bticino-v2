<script type="text/x-red" data-help-name="myhome-light">
<p>Voegt een MyHome Light node toe aan je flow.</p>
  <ul>
    <li><strong>Naam</strong> (verplicht) is de naam van de node</li>
    <li><strong>Topic</strong> wordt gebruikt op de ontvangen payload om de actie op de node te activeren (zie info bij de definitie van de ingangen)</li>
    <li><strong>Gateway</strong> is de gateway die geconfigureerd moet worden om verbinding te maken met het MyHome-systeem</li>
    <li><strong>Lamp</strong> is het adres van de belasting in het MyHome-systeem ('A=1 PL=5' wordt '15', let er ook op dat het formaat 4 cijfers telt wanneer A>9 of PL>9, bv. 'A=11 PL=5' wordt `1105`, 'A=1 PL=15' wordt '0115')</li>
      <ul>
        <li><strong>Dit is een groepsverwijzing</strong> moet aangevinkt worden wanneer het gedefinieerde belastingsadres gebruikt moet worden als een groepsadres in plaats van een individuele belasting (punt-tot-punt oproep)</li>
      </ul>
    <li><strong>Enkel de huidige status van de belasting opvragen</strong> : indien ingeschakeld, wordt de ontvangen payload (bijvoorbeeld 'ON', 'OFF' of iets anders) genegeerd en wordt een statusaanvraag verstuurd om de huidige status van de belasting op te vragen zonder iets te wijzigen.
      <br>Opmerking : dit kan niet ingeschakeld worden voor groepen, aangezien deze geen eigen status hebben binnen het MyHome-systeem.
    </li>
    <li><strong>ALLE inkomende gateway-events overslaan</strong> : indien ingeschakeld, worden alle MyHome-statusupdates die de gateway over deze node ontvangt, genegeerd, zodat enkel de door Node-RED ontvangen payloads verwerkt worden.</li>
    <li><strong>SmartFilter</strong>
      <ul>
        <li>
            <strong>Inkomende gateway-events filteren</strong> : indien ingeschakeld, activeert de node pas een nieuwe flow (m.a.w. output) wanneer een status is GEWIJZIGD na ontvangst van een MyHome BUS-bericht. Dit voorkomt dat er meerdere flows starten voor dezelfde info/opdracht, aangezien MyHome hetzelfde bericht meerdere keren verstuurt (bij statusaanvraag, antwoord, ...)
        </li>
        <li>
            <strong>Uitgaande opdrachten naar de gateway filteren</strong> : kan ingeschakeld worden om te vermijden dat onnodige opdrachten naar de gateway worden verstuurd. De node bepaalt of een opdracht nuttig is op basis van de laatst gekende status van de node (bv. als een lamp al 'aan' is, hoeft er geen nieuwe opdracht verstuurd te worden om ze weer aan te zetten). Wanneer het ontvangen bericht (msg.payload) als 'nutteloos' wordt beschouwd, stopt de node de flow (er wordt dus geen bericht naar een output verstuurd).
            Opmerking : bij gebruik voor groepen baseert de node zich enkel op de laatste opdrachten die hij zelf heeft verstuurd, aangezien groepen als dusdanig geen eigen status hebben binnen het MyHome-systeem.
        </li>
      </ul>
    </li>
  </ul>

<h3>Ingangen</h3>
  <p><code>msg.payload</code> kan van 2 types zijn</p>
    <ul>
      <li>Een eenvoudige waarde
        <ul>
          <li>een eenvoudige <em>tekst</em> zijnde 'ON' of 'OFF'.
            <br>'TOGGLE' kan ook gebruikt worden om te schakelen van ON->OFF of OFF->ON op basis van de laatst gekende status (indien onbekend, wordt OFF verondersteld).
            <br>Bij het aansturen van dimmers kan het huidige helderheidsniveau verhoogd of verlaagd worden met 'UP' of 'DOWN'.</li>
          <li>een eenvoudige <em>boolean</em> zijnde 'true' of 'false'</li>
          <li>een eenvoudige <em>numerieke waarde</em> tussen '0' en '100'. Enkel van toepassing voor dimbare lampen ('0' betekent uit, een andere waarde zet de lamp aan op het opgegeven helderheidspercentage, afgerond naar het dichtstbijzijnde tiental)</li>
        </ul>
      </li>
      <li>Een object
        <ul>
          <li> <code>payload.state</code> <em>[tekst]</em> de waarde moet 'ON' of 'OFF' zijn. Kan ook 'UP' of 'DOWN' zijn voor dimmers</li>
          <li> <code>payload.On</code> <em>[boolean]</em> de waarde moet 'True' of 'False' zijn<br>
            (dient als terugval wanneer .state niet gedefinieerd is)</li>
          <li> <code>payload.brightness</code> <em>[geheel getal]</em> (optioneel, enkel voor dimmers) geeft het helderheidspercentage weer dat wordt toegepast op de belasting, van 20 tot 100</li>
        </ul>
      </li>
    </ul>
  <p><code>msg.topic</code> is vereist om de actie van de node te activeren: de ontvangen <code>msg.topic</code> moet ingesteld zijn op <code>cmd/xxxx</code>, waarbij xxxx de waarde is die als Topic in de nodeconfiguratie is gedefinieerd.</p>

<h3>Uitgangen</h3>
  <p>De <strong>primaire output</strong> is een JSON-object <code>msg.payload</code> met</p>
    <ul>
      <li> <code>payload.state</code> <em>[tekst]</em> de waarde is 'ON' of 'OFF'</li>
      <li> <code>payload.brightness</code> <em>[geheel getal]</em> (enkel teruggegeven voor dimmers) geeft het huidige helderheidspercentage van de belasting weer</li>
      <li> <code>payload.command_sent</code> <em>[array van tekst]</em> wanneer de node vanuit Node-RED werd geactiveerd (d.w.z. er werden opdrachten naar de MyHome-gateway verstuurd), bevat dit de opdrachten die verstuurd werden in het OpenWebNet-protocol (bv. <em>'*1*1*15##'</em> om belasting 1.5 aan te zetten)</li>
      <li> <code>payload.command_received</code> <em>[tekst]</em> wanneer de node vanuit de gateway werd geactiveerd (d.w.z. er werd een opdracht gedetecteerd op de MyHome BUS voor de geconfigureerde belasting), bevat dit de opdracht die werd gelezen in het OpenWebNet-protocol (bv: <em>'*1*5*25##'</em> betekent dat belasting 2.5 werd aangezet op 50% helderheid)</li>
      <li> <code>payload.command_responses</code> <em>[array van tekstwaarden]</em> wanneer de node vanuit Node-RED in alleen-lezen modus werd geactiveerd, bevat dit het/de antwoord(en) dat/die door de MyHome BUS werd(en) teruggestuurd in het OpenWebNet-protocol</li>
      <li> <code>payload.command_failed</code> <em>[array van tekstwaarden]</em> bevat de opdrachten die door de MyHome-gateway geweigerd werden, in het OpenWebNet-protocol</li>
    </ul>

  <p>De <strong>secundaire output</strong> kan geconfigureerd worden om beter aan te sluiten bij de noden van andere nodetypes die je gebruikt, zonder dat je voor elke connector een extra function/switch-node moet toevoegen
    <br>
    <u>Voorbeelden:</u>
  </p>
    <ul>
      <li><strong>HUEMagic</strong>-nodes ondersteunen :
        <ul>
          <li><code>payload</code> die een boolean is (true/false)</li>
          <li><code>payload</code> die een JSON-object is waarbij <code>.ON</code> een boolean is (true/false)</li>
        </ul>
      </li>
      <li><strong>Homekit-bridge</strong>-nodes ondersteunen :
        <ul>
          <li><code>payload</code> die een JSON-object is waarbij <code>.On</code> een boolean is (true/false)</li>
        </ul>
        <p>(zie:&nbsp;<a title="homekit bridged" href="https://www.npmjs.com/package/node-red-contrib-homekit-bridged" target="_blank" rel="noopener">https://www.npmjs.com/package/node-red-contrib-homekit-bridged</a>) waarmee je de iOS Home-app kan beheren.</p>
      </li>
      <li><strong>MyHome</strong>-nodes ondersteunen :
        <ul>
          <li><code>payload</code> die ofwel een boolean is (true/false), ofwel een tekst (ON/OFF/OPEN/CLOSE/...)</li>
          <li><code>payload</code> die een JSON-object is waarbij <code>.state</code> een tekst is (ON/OFF/OPEN/CLOSE/...)</li>
          <li><code>payload</code> die een JSON-object is waarbij <code>.On</code> een boolean is (true/false)</li>
        </ul>
      </li>
    </ul>
    <p>
      <strong>Beide outputs</strong> bevatten ook een extra object <code>msg.mh_nodeConfigInfo</code> met gegevens uit de nodeconfiguratie.
      Dit kan in flows gebruikt worden om berichten door te sturen op basis van hun herkomst (d.w.z. welke node ze verstuurde), zonder dat je bij elke stap 'change nodes' moet toevoegen.
    </p>
    <p>
      De <code>msg.mh_nodeConfigInfo</code> bevat de volgende configuratiewaarden van de node :
    </p>
    <ul>
      <li> <code>mh_nodeConfigInfo.name</code> <em>[tekst]</em> : naam</li>
      <li> <code>mh_nodeConfigInfo.topic</code> <em>[tekst]</em> : topic</li>
      <li> <code>mh_nodeConfigInfo.buslevel</code> <em>[tekst]</em> : busniveau (zoals 'private_riser', '01', '02', ... '15')</li>
      <li> <code>mh_nodeConfigInfo.lightid</code> <em>[tekst]</em> : lamp-ID</li>
      <li> <code>mh_nodeConfigInfo.isgroup</code> <em>[boolean]</em> : geconfigureerd als groep (true) of als individueel lichtpunt (false)</li>
      <li> <code>mh_nodeConfigInfo.gateway</code> <em>[object]</em> : gekoppelde gateway-info : naam (<code>.name</code>), host/IP (<code>.host</code>) en poort (<code>.port</code>)</li>
    </ul>
</script>
